services:
  draft-helper:
    image: ghcr.io/crimsondami/fantasy-draft-helper:v0.6.3
    ports:
      - "3000:3000"
    volumes:
      - draft-helper-data:/app/data
    environment:
      - ALLOWED_USERNAMES=alice,bob,carol   # replace with your own league's usernames
    restart: unless-stopped

volumes:
  draft-helper-data: