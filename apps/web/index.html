<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("draft-helper-theme"));
          if (stored && stored.tokens) {
            var root = document.documentElement.style;
            Object.keys(stored.tokens).forEach(function (key) {
              var cssVar = "--color-" + key.replace(/([A-Z])/g, "-$1").toLowerCase();
              root.setProperty(cssVar, stored.tokens[key]);
            });
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
