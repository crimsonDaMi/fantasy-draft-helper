name: Release image

# Triggers only on tags matching the project's vMAJOR.MINOR.PATCH scheme,
# i.e. after `pnpm release vX.Y.Z` (or the manual steps in RELEASING.md)
# have already tagged and pushed the commit. This workflow does NOT bump
# package.json, commit, or create the tag — scripts/release.sh (run
# locally) still owns that part, including its safety checks (clean
# working tree, version format, no tag reuse).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # github.ref_name on a tag push is the tag itself, e.g. "v0.6.0" —
          # matches whatever scripts/release.sh already pushed, so there's
          # no separate version parsing to keep in sync.
          tags: |
            ghcr.io/crimsondami/fantasy-draft-helper:${{ github.ref_name }}
            ghcr.io/crimsondami/fantasy-draft-helper:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
