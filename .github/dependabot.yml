# Weekly dependency update PRs. Minor/patch updates are grouped into one
# PR per ecosystem; npm major updates arrive as individual PRs since they
# usually need code changes (e.g. the react-router v6 -> v7 upgrade).
# .github/workflows/verify.yml runs the full verification gate on each
# PR — wait for it to pass before merging. See RELEASING.md.
version: 2
updates:
  - package-ecosystem: npm # covers the pnpm workspace via pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node must match the Node major the app runs on (the
      # Dockerfile's node:<major>-slim image). Dependabot isn't LTS-aware
      # and would propose each new major on release, months before it's
      # LTS. .github/workflows/node-lts.yml opens an issue instead when a
      # newer LTS exists; bump the image, audit.yml and @types/node together.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns:
          - "*"
