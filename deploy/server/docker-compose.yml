services:
  draft-helper:
    image: ghcr.io/crimsondami/fantasy-draft-helper:v1.4.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - draft-helper-data:/app/data
    environment:
      - ALLOWED_USERNAMES=${ALLOWED_USERNAMES}
    restart: unless-stopped

volumes:
  draft-helper-data:
    # Fixed name, independent of the directory this file is run from.
    name: fantasy-draft-helper-data
