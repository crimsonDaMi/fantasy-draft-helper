services:
  draft-helper:
    image: ghcr.io/crimsondami/fantasy-draft-helper:v2.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - draft-helper-data:/app/data
    environment:
      - ALLOWED_USERNAMES=${ALLOWED_USERNAMES:-}
      - OPEN_REGISTRATION=${OPEN_REGISTRATION:-false}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - ACCOUNT_RETENTION_DAYS=${ACCOUNT_RETENTION_DAYS:-}
      - OPERATOR_NAME=${OPERATOR_NAME:-}
      - OPERATOR_CONTACT=${OPERATOR_CONTACT:-}
      - OPERATOR_ADDRESS=${OPERATOR_ADDRESS:-}
    # Request logs contain visitors' IP addresses; the privacy notice says
    # they are deleted as newer entries replace them.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  draft-helper-data:
    # Fixed name, independent of the directory this file is run from.
    name: fantasy-draft-helper-data
